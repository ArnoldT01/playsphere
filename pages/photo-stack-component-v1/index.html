<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Stack Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #f0f0f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 64px 24px 80px;
            gap: 72px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #f0f0f5;
        }

        .section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            width: 100%;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #7a7a9a;
        }

        /* ── v1 ── */
        .v1 .photostack {
            display: flex;
            justify-content: center;
        }

        .v1 .image-container {
            position: relative;
            width: 300px;
            height: 200px;
            margin: 0 -10px;
            transform: rotate(-10deg);
            transition: transform 0.3s ease;
            z-index: 1;
        }

        .v1 .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .v1 .image-container:hover {
            transform: rotate(0deg) scale(1.1);
            z-index: 10;
        }

        .v1 .overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            font-size: 14px;
            border-radius: 5px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .v1 .image-container:hover .overlay {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── v2 ── */
        .v2 .photostack {
            display: flex;
            justify-content: center;
        }

        .v2 .image-wrapper {
            position: relative;
            margin: 0 -10px;
            z-index: 1;
        }

        .v2 .image-container {
            width: 300px;
            height: 200px;
            transform: rotate(-10deg);
            transition: transform 0.3s ease;
        }

        .v2 .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .v2 .image-wrapper:hover .image-container {
            transform: rotate(0deg) scale(1.1);
        }

        .v2 .image-wrapper:hover {
            z-index: 100;
        }

        .v2 .overlay {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            font-size: 13px;
            border-radius: 5px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 20;
        }

        .v2 .image-wrapper:hover .overlay {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <h1>Photo Stack Component</h1>

    <div class="section v1">
        <span class="section-label">v1.0 — overlay inside card</span>
        <div class="photostack">
            <div class="image-container">
                <img src="1.png" alt="Photo 1">
                <div class="overlay">Nice View</div>
            </div>
            <div class="image-container">
                <img src="2.jpg" alt="Photo 2">
                <div class="overlay">Mountains</div>
            </div>
            <div class="image-container">
                <img src="3.jpg" alt="Photo 3">
                <div class="overlay">City Life</div>
            </div>
        </div>
    </div>

    <div class="section v2">
        <span class="section-label">v2.0 — overlay above card</span>
        <div class="photostack">
            <div class="image-wrapper">
                <div class="image-container">
                    <img src="1.png" alt="Photo 1">
                </div>
                <div class="overlay">Nice View</div>
            </div>
            <div class="image-wrapper">
                <div class="image-container">
                    <img src="2.jpg" alt="Photo 2">
                </div>
                <div class="overlay">Mountains</div>
            </div>
            <div class="image-wrapper">
                <div class="image-container">
                    <img src="3.jpg" alt="Photo 3">
                </div>
                <div class="overlay">City Life</div>
            </div>
        </div>
    </div>

</body>
</html>
